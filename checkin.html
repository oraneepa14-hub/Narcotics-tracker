<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ระบบยืนยันจำนวนยาเสพติด/วัตถุออกฤทธิ์ต่อจิตประสาท - คลังยาย่อย</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; width: 100%; overflow-x: hidden; font-size: 16px; }
  body { zoom: 0.92; }
  body { font-family: 'Sarabun', 'Noto Sans Thai', sans-serif; margin: 0; overflow-x: hidden; background: radial-gradient(circle at 6% 15%, rgba(18,147,159,0.08), transparent 42%), radial-gradient(circle at 95% 12%, rgba(183,134,42,0.07), transparent 40%), radial-gradient(circle at 12% 92%, rgba(26,74,122,0.07), transparent 42%), radial-gradient(circle at 90% 90%, rgba(14,124,134,0.07), transparent 42%), #f8fafc; background-attachment: fixed; }
  .app { width: 100%; max-width: 100%; margin: 0; padding: 28px clamp(20px, 3vw, 56px) 48px; box-sizing: border-box; }
  .card { background: #fff; border-radius: 14px; padding: 16px 20px; box-shadow: 0 2px 10px rgba(11,36,64,0.08); margin-bottom: 12px; }
  h1 { font-size: 1.25rem; color: #102a43; margin-bottom: 4px; }
  .sub { color: #777; font-size: 0.9rem; margin-bottom: 16px; }
  label { display: block; font-size: 0.9rem; color: #444; margin: 10px 0 4px; }
  select, input, textarea { width: 100%; padding: 10px; border: 1.5px solid #e2e8f0; border-radius: 8px; font-size: 1rem; box-sizing: border-box; font-family: inherit; transition: border-color 0.2s ease, box-shadow 0.2s ease; }
  select:focus, input:focus, textarea:focus { outline: none; border-color: #0EA5E9; box-shadow: 0 0 0 3px rgba(14,165,233,0.16); }
  button { width: 100%; padding: 12px; background: #0EA5E9; color: #fff; border: none; border-radius: 10px; font-size: 1rem; margin-top: 16px; cursor: pointer; transition: background 0.2s ease, box-shadow 0.2s ease; }
  button:hover:not(:disabled) { background: #0284C7; box-shadow: 0 4px 12px rgba(14,165,233,0.3); }
  button:disabled { background: #ccc; }
  .status { margin-top: 12px; padding: 10px; border-radius: 8px; font-size: 0.9rem; }
  .ok { background: #dcfce7; color: #166534; }
  .err { background: #fee2e2; color: #991b1b; }
  .loading { text-align: center; color: #888; padding: 20px; }

  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { padding: 8px 6px; border-bottom: 1px solid #eee; text-align: left; vertical-align: middle; }
  th { color: #666; font-weight: 600; font-size: 0.8rem; }
  td.qty-col, th.qty-col { width: 90px; }
  td input[type=number] { padding: 6px; text-align: center; width: 100%; min-width: 0; }
  td input[type=text] { padding: 6px; width: 100%; min-width: 0; }
  .item-name { font-weight: 500; }
  .system-qty { color: #888; font-size: 0.85rem; }
  .mismatch { background: #fff7ed; }
  .mismatch input[type=number] { border-color: #f97316; }
  .badge-diff { display: inline-block; margin-top: 2px; font-size: 0.75rem; color: #c2410c; }  .required-mark { color: #ef4444; font-weight: 800; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .spinner { width: 15px; height: 15px; border-radius: 50%; border: 2px solid rgba(14,165,233,0.25); border-top-color: #0EA5E9; animation: spin 0.7s linear infinite; display: inline-block; flex-shrink: 0; }
  .loading-row { display: inline-flex; align-items: center; gap: 8px; color: #0284C7; font-size: 0.85rem; }

  /* ---------- Responsive: มือถือ/แท็บเล็ต ---------- */
  /* iOS Safari รองรับ CSS zoom แบบไม่แน่นอน (ทำให้ตัวเลขในช่องกรอกแคบๆ โดนตัดบางส่วน) ปิดไว้บนจอเล็ก */
  @media (max-width: 900px) {
    body { zoom: 1; }
    .app { padding: 16px 12px 40px; }
  }
  @media (max-width: 700px) {
    .table-wrap table, .table-wrap thead, .table-wrap tbody, .table-wrap th, .table-wrap td, .table-wrap tr {
      display: block;
    }
    .table-wrap thead { display: none; }
    .table-wrap tr {
      border: 1px solid #e2e8f0; border-radius: 10px; padding: 10px 12px; margin-bottom: 10px;
    }
    .table-wrap td {
      border-bottom: none; padding: 6px 0; display: flex; align-items: center; gap: 10px;
    }
    .table-wrap td.qty-col { width: auto; }
    .table-wrap td::before {
      content: attr(data-label); font-size: 0.72rem; font-weight: 700; color: #829ab1;
      text-transform: uppercase; letter-spacing: 0.3px; flex-shrink: 0; min-width: 110px;
    }
    .table-wrap td[data-label="ชื่อยา"] { display: block; }
    .table-wrap td[data-label="ชื่อยา"]::before { display: block; margin-bottom: 4px; }
    .table-wrap td[data-label="ชื่อยา"] .item-name { display: block; width: 100%; white-space: normal; word-break: break-word; }
    .table-wrap td[data-label="ชื่อยา"] .sub { display: block; width: 100%; white-space: normal; }
  }
</style>
<script>
(function() {
  var REQUIRED_ROLES = ["staff", "admin"];
  var session = null;
  try { session = JSON.parse(localStorage.getItem("narcoticsSession")); } catch (e) {}
  var now = new Date();
  if (!session || !session.token || !session.expiresAt || new Date(session.expiresAt) < now) {
    localStorage.removeItem("narcoticsSession");
    window.location.href = "index.html";
  } else if (REQUIRED_ROLES.indexOf(session.role) === -1) {
    window.location.href = "index.html";
  } else {
    window.NARCOTICS_SESSION = session;
  }
})();
</script>
</head>
<body>
<div id="narcoticsTopbar" style="display:flex;align-items:center;justify-content:flex-end;gap:12px;background:#102a43;padding:9px 22px;width:100%;box-sizing:border-box;font-family:'Sarabun','Noto Sans Thai',sans-serif;font-size:0.85rem;color:#cbd5e1;border-bottom:1px solid #1c3a54;">
  <a href="index.html" style="color:#ffffff;text-decoration:none;font-weight:600;margin-right:auto;">&larr; กลับหน้าหลัก</a>
  <span>เข้าสู่ระบบในนาม <b id="narcoticsUserName" style="color:#ffffff;"></b></span>
  <span id="narcoticsUserRole" style="background:rgba(255,255,255,0.12);color:#fff;border:1px solid rgba(255,255,255,0.2);padding:2px 10px;border-radius:6px;font-size:0.78rem;"></span>
  <button onclick="narcoticsLogout()" style="width:auto;margin-top:0;background:transparent;color:#fca5a5;border:1px solid rgba(252,165,165,0.4);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:0.8rem;">ออกจากระบบ</button>
</div>
<script>
  (function() {
    var s = window.NARCOTICS_SESSION;
    if (!s) return;
    document.getElementById("narcoticsUserName").textContent = s.displayName || s.username;
    document.getElementById("narcoticsUserRole").textContent = s.role === "admin" ? "ผู้ดูแลระบบ" : "ผู้ปฏิบัติงาน";
  })();
  function narcoticsLogout() {
    var s = window.NARCOTICS_SESSION;
    localStorage.removeItem("narcoticsSession");
    if (s && s.token && typeof API_URL !== "undefined") {
      fetch(API_URL, { method: "POST", body: JSON.stringify({ token: (window.NARCOTICS_SESSION||{}).token,  action: "logout", token: s.token }) }).catch(function(){});
    }
    window.location.href = "index.html";
  }
</script>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

// เรียงรายการยาตามรหัส INVs (ItemCode) จากน้อยไปมาก — เทียบแบบตัวเลขถ้าเป็นตัวเลขได้ทั้งคู่ ไม่งั้นเทียบแบบข้อความ
const byItemCode = (a, b) => {
  const na = Number(a.itemCode), nb = Number(b.itemCode);
  if (!isNaN(na) && !isNaN(nb)) return na - nb;
  return String(a.itemCode).localeCompare(String(b.itemCode));
};

// URL ของ Apps Script Web App
const API_URL = "https://script.google.com/macros/s/AKfycbxpNAS-o0fcxYeCorsy6vRI6XkfFeWOEfBLRZ2VbMcHANn2ijkKWhNa92EwCp5aotv5jw/exec";
const STORAGE_POINT = "sub_warehouse"; // เช็คเฉพาะคลังยาย่อยเท่านั้น ไม่ต้องเลือก

function App() {
  const session = window.NARCOTICS_SESSION || {};
  const [notes, setNotes] = useState("");
  const [status, setStatus] = useState(null);
  const [loading, setLoading] = useState(false);
  const [items, setItems] = useState(null); // null = กำลังโหลด
  const [counts, setCounts] = useState({});   // rowKey -> countedQty (string)
  const [itemNotes, setItemNotes] = useState({}); // rowKey -> note (string)

  // ใช้ rowId (รหัสเฉพาะประจำแถวใน StockLedger) เป็นกุญแจหลักในการอ้างอิงแต่ละแถว
  // เพราะยาชื่อ/รหัสเดียวกัน อาจมีได้หลาย Lot ในคลังเดียวกัน (คนละแถว) — ถ้าใช้แค่ itemCode
  // การแก้ไขแถวหนึ่งจะไปกระทบแถวอื่นที่มี itemCode ซ้ำกันด้วยโดยไม่ตั้งใจ
  const rowKey = (it) => it.rowId || `${it.itemCode}|${it.lot}|${it.expiryDate}`;

  // ซ่อนรายการที่จำนวนคงเหลือในระบบเป็น 0 ออกจากตารางแสดงผล (ยังส่งข้อมูลไปพร้อมกับรายการอื่นตอนบันทึกตามปกติ ไม่กระทบการบันทึกจริง)
  const visibleItems = (items || []).filter(it => Number(it.systemQty) > 0);

  // ถ้ายารหัสเดียวกันมีหลาย Lot ให้กำกับ (1/2), (2/2) ต่อท้ายรหัส INVs เพื่อแยกให้เห็นชัดว่าเป็นคนละ Lot
  // นับจากรายการที่แสดงจริง (ไม่รวมรายการที่คงเหลือ 0 ที่ถูกซ่อนไปแล้ว)
  const lotSuffixMap = {};
  if (items) {
    const countByCode = {};
    visibleItems.forEach(it => { countByCode[it.itemCode] = (countByCode[it.itemCode] || 0) + 1; });
    const seenSoFar = {};
    visibleItems.forEach(it => {
      const total = countByCode[it.itemCode];
      if (total > 1) {
        seenSoFar[it.itemCode] = (seenSoFar[it.itemCode] || 0) + 1;
        lotSuffixMap[rowKey(it)] = ` (${seenSoFar[it.itemCode]}/${total})`;
      }
    });
  }

  useEffect(() => {
    fetch(`${API_URL}?action=getSubWarehouseStock&token=${(window.NARCOTICS_SESSION||{}).token}`)
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          setItems(data.data.sort(byItemCode));
          const initCounts = {};
          data.data.forEach(it => { initCounts[rowKey(it)] = String(it.systemQty); });
          setCounts(initCounts);
        } else {
          setStatus({ ok: false, msg: data.error || "โหลดรายการยาไม่สำเร็จ" });
          setItems([]);
        }
      })
      .catch(err => {
        setStatus({ ok: false, msg: "เชื่อมต่อระบบไม่สำเร็จ: " + err.message });
        setItems([]);
      });
  }, []);

  const updateCount = (key, value) => {
    setCounts(prev => ({ ...prev, [key]: value }));
  };

  const updateItemNote = (key, value) => {
    setItemNotes(prev => ({ ...prev, [key]: value }));
  };

  const submit = async () => {
    setLoading(true);
    setStatus(null);
    try {
      const checkRes = await fetch(`${API_URL}?action=checkShiftAlreadyConfirmed&token=${(window.NARCOTICS_SESSION||{}).token}`);
      const checkData = await checkRes.json();
      if (checkData.success && checkData.data && checkData.data.exists) {
        const proceed = window.confirm(
          `เนื่องจาก "${checkData.data.staffName}" ได้บันทึกข้อมูลยืนยันจำนวนคงเหลือของเวรนี้ไปแล้วก่อนหน้านี้ (เมื่อ ${checkData.data.timestamp})\nยืนยันจะบันทึกข้อมูลซ้ำอีกครั้งใช่หรือไม่?`
        );
        if (!proceed) {
          setLoading(false);
          return;
        }
      }

      const confirmedCounts = (items || []).map(it => ({
        itemCode: it.itemCode,
        itemName: it.itemName,
        lot: it.lot,
        expiryDate: it.expiryDate,
        systemQty: it.systemQty,
        countedQty: counts[rowKey(it)],
        note: itemNotes[rowKey(it)] || ""
      }));

      const res = await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ token: (window.NARCOTICS_SESSION||{}).token, 
          action: "submitShiftCheckin",
          staffName: session.displayName,
          staffUsername: session.username,
          storagePoint: STORAGE_POINT,
          confirmedCounts,
          notes
        })
      });
      const data = await res.json();
      if (data.success) {
        setStatus({ ok: true, msg: `ยืนยันสำเร็จ (เวร: ${data.shiftType === 'morning' ? 'เช้า' : 'บ่าย/ดึก'})` });
      } else {
        setStatus({ ok: false, msg: data.error || "เกิดข้อผิดพลาด" });
      }
    } catch (err) {
      setStatus({ ok: false, msg: "เชื่อมต่อระบบไม่สำเร็จ: " + err.message });
    }
    setLoading(false);
  };

  return (
    <div className="app">
      <div className="card">
        <h1>ยืนยันจำนวนคงเหลือยาเสพติด/วัตถุออกฤทธิ์ — คลังยาย่อย</h1>
        <div className="sub">การกดยืนยันถือเป็นการลงลายมือชื่อผู้ปฏิบัติงานเวรนี้ โดยใช้บัญชีที่เข้าสู่ระบบเป็นผู้ยืนยัน</div>
        <div className="sub" style={{marginTop: "-8px"}}>
          ผู้ปฏิบัติงานเวรนี้: <b style={{color: "#102a43"}}>{session.displayName}</b> ({session.username})
        </div>
      </div>

      <div className="card">
        <h1 style={{fontSize: "1.05rem"}}>รายการยาเสพติดประเภท 2 / วัตถุออกฤทธิ์ประเภท 2 (คลังยาย่อย)</h1>
        <div className="sub">ตรวจนับจริงแล้วปรับจำนวนในช่องได้ถ้าไม่ตรงกับจำนวนในระบบ พร้อมระบุหมายเหตุ</div>

        {items === null && <div className="loading-row"><span className="spinner"></span> กำลังโหลดรายการยา...</div>}
        {items && items.length === 0 && <div className="loading">ไม่พบรายการยาในคลังยาย่อย</div>}
        {items && items.length > 0 && visibleItems.length === 0 && <div className="loading">ยารายการทั้งหมดในคลังนี้มีจำนวนคงเหลือ 0 ไม่มีรายการให้ยืนยัน</div>}

        {visibleItems.length > 0 && (
          <div className="table-wrap">
          <table>
            <thead>
              <tr>
                <th>รหัส INVs</th>
                <th>ชื่อยา</th>
                <th className="qty-col">จำนวนคงเหลือ<br/>(ตามระบบคลังย่อย)</th>
                <th>หน่วย</th>
                <th>Max rate</th>
                <th className="qty-col">จำนวนที่ปรากฏ</th>
                <th>หมายเหตุ</th>
              </tr>
            </thead>
            <tbody>
              {visibleItems.map(it => {
                const key = rowKey(it);
                const counted = counts[key] ?? "";
                const isMismatch = String(counted) !== String(it.systemQty);
                return (
                  <tr key={key} className={isMismatch ? "mismatch" : ""}>
                    <td data-label="รหัส INVs">{it.itemCode}{lotSuffixMap[key] || ""}</td>
                    <td data-label="ชื่อยา">
                      <div className="item-name">{it.itemName}</div>
                      {it.lot && <div className="sub" style={{margin: 0, fontSize: "0.75rem"}}>Lot: {it.lot} {it.expiryDate ? `· หมดอายุ: ${it.expiryDate}` : ""}</div>}
                      {isMismatch && <div className="badge-diff">⚠ ไม่ตรงกับระบบ</div>}
                    </td>
                    <td className="qty-col" data-label="จำนวนคงเหลือ (ระบบ)">{it.systemQty}</td>
                    <td data-label="หน่วย">{it.unit}</td>
                    <td data-label="Max rate">{it.maxRate}</td>
                    <td className="qty-col" data-label="จำนวนที่ปรากฏ">
                      <input
                        type="number"
                        value={counted}
                        onChange={e => updateCount(key, e.target.value)}
                      />
                    </td>
                    <td data-label="หมายเหตุ">
                      <input
                        type="text"
                        placeholder="ถ้ามี"
                        value={itemNotes[key] || ""}
                        onChange={e => updateItemNote(key, e.target.value)}
                      />
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
          </div>
        )}
      </div>

      <div className="card">
        <label>หมายเหตุรวมของเวรนี้ (ถ้ามี)</label>
        <textarea rows="3" value={notes} onChange={e => setNotes(e.target.value)} />

        <button onClick={submit} disabled={loading || items === null}>
          {loading ? (<span className="loading-row" style={{color: "#fff"}}><span className="spinner" style={{borderTopColor: "#fff", borderColor: "rgba(255,255,255,0.4)"}}></span> กำลังบันทึก...</span>) : "ยืนยันจำนวนคงเหลือ"}
        </button>

        {status && (
          <div className={`status ${status.ok ? "ok" : "err"}`}>{status.msg}</div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
