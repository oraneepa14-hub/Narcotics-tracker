  * { box-sizing: border-box; }

  .field-icon { position: relative; }

  .scroll-table { max-height: min(620px, 64vh); overflow: auto; border: 1px solid #eee; border-radius: 8px; }

  .modal-box { background: #fff; border-radius: 14px; padding: 24px; max-width: 380px; width: 90%; text-align: center; }

  .modal-btn-row { display: flex; flex-direction: column; gap: 10px; }

  .modal-btn-row button.received { background: #dcfce7; color: #166534; }

<script>
(function() {
  var REQUIRED_ROLES = ["staff", "admin"];
  var session = null;
  try { session = JSON.parse(localStorage.getItem("narcoticsSession")); } catch (e) {}
  var now = new Date();
  if (!session || !session.token || !session.expiresAt || new Date(session.expiresAt) < now) {
    localStorage.removeItem("narcoticsSession");
    window.location.href = "index.html";
  } else if (REQUIRED_ROLES.indexOf(session.role) === -1) {
    window.location.href = "index.html";
  } else {
    window.NARCOTICS_SESSION = session;
  }
})();
</script>

<div id="narcoticsTopbar" style="display:flex;align-items:center;justify-content:flex-end;gap:12px;background:#102a43;padding:9px 22px;width:100%;box-sizing:border-box;font-family:'Sarabun','Noto Sans Thai',sans-serif;font-size:0.85rem;color:#cbd5e1;border-bottom:1px solid #1c3a54;">

  <button onclick="narcoticsLogout()" style="background:transparent;color:#fca5a5;border:1px solid rgba(252,165,165,0.4);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:0.8rem;">ออกจากระบบ</button>

  (function() {

    document.getElementById("narcoticsUserRole").textContent = s.role === "admin" ? "ผู้ดูแลระบบ" : "ผู้ปฏิบัติงาน";
  })();
  function narcoticsLogout() {
    var s = window.NARCOTICS_SESSION;
    localStorage.removeItem("narcoticsSession");

      fetch(API_URL, { method: "POST", body: JSON.stringify({ token: (window.NARCOTICS_SESSION||{}).token,  action: "logout", token: s.token }) }).catch(function(){});
    }
    window.location.href = "index.html";

<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

/* ---------------- ช่องกรองวันที่: แสดงผลเป็น DD/MM/YYYY เสมอ ไม่พึ่งภาษา/โซนของเบราว์เซอร์ ---------------- */
function DateFilterField({ value, onChange }) {
  const toDisplay = (iso) => {
    if (!iso) return "";
    const [y, m, d] = iso.split("-");
    return `${d}/${m}/${y}`;
  };
  const toIso = (display) => {
    const m = display.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if (!m) return null;
    return `${m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`;
  };
  const [text, setText] = useState(toDisplay(value));
  useEffect(() => { setText(toDisplay(value)); }, [value]);

  return (
    <div style={{display: "flex", gap: "6px", alignItems: "stretch"}}>
      <input
        style={{flex: 1}}
        value={text}
        placeholder="DD/MM/YYYY"
        onChange={e => {
          setText(e.target.value);
          const iso = toIso(e.target.value);
          if (iso) onChange(iso);
          else if (e.target.value === "") onChange("");
        }}
      />
      <input
        type="date"
        onChange={e => onChange(e.target.value)}
        title="เลือกวันจากปฏิทิน"
        style={{width: "42px", padding: "9px 4px", flexShrink: 0}}
      />
    </div>
  );
}

/* ---------------- ไอคอนเส้นเล็กๆ ใช้ในแท็บ/ช่องกรอกข้อมูล ---------------- */
const Icon = ({ name, size = 16, stroke = "currentColor" }) => {
  const common = { width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: stroke, strokeWidth: 1.8, strokeLinecap: "round", strokeLinejoin: "round" };
  switch (name) {
    case "edit": return (<svg {...common}><path d="M12 20h9" /><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" /></svg>);
    case "history": return (<svg {...common}><circle cx="12" cy="13" r="8" /><path d="M12 9v4l3 2" /><path d="M9 2h6" /></svg>);
    case "chart": return (<svg {...common}><path d="M4 20V10" /><path d="M11 20V4" /><path d="M18 20v-7" /><path d="M3 20h18" /></svg>);
    case "id-card": return (<svg {...common}><rect x="3" y="5" width="18" height="14" rx="2" /><circle cx="8.5" cy="10.5" r="1.6" /><path d="M6 15c0-1.4 1.1-2.3 2.5-2.3s2.5.9 2.5 2.3" /><path d="M14 9.5h4M14 13h4" /></svg>);
    case "hash": return (<svg {...common}><path d="M5 9h14M5 15h14M10 4L8 20M16 4l-2 16" /></svg>);
    default: return null;
  }
};

// URL ของ Apps Script Web App
const API_URL = "https://script.google.com/macros/s/AKfycbxpNAS-o0fcxYeCorsy6vRI6XkfFeWOEfBLRZ2VbMcHANn2ijkKWhNa92EwCp5aotv5jw/exec";

const DISPENSE_POINTS = [
  { value: "sub_warehouse", label: "คลังยาย่อย" },
  { value: "er_cabinet", label: "ตู้ยาเสพติด ER นอกเวลา" }
];

const DEFAULT_QTY_ONE_DRUGS = [
  "Pethidine HCl inj. 50 mg/ml/amp",
  "Morphine sulfate inj 10 mg/ml/amp",
  "Morphine solution 10 mg/5 ml (60 ml)"
];

function fmt(n) {
  if (n === "" || n === undefined || n === null) return "-";
  const num = Number(n);
  return isNaN(num) ? n : num.toLocaleString();
}

/**
 * ช่องค้นหาชื่อยาจากฐานข้อมูลยา (DrugMaster) — เลือกแล้ว auto-fill รหัส/หน่วย
 * และตั้งจำนวนเบิก default = 1 ถ้าเป็นยาในลิสต์ที่กำหนด
 */
function DrugMasterPicker({ onSelect }) {
  const [drugList, setDrugList] = useState(null);
  const [query, setQuery] = useState("");
  const [matched, setMatched] = useState(null);

  useEffect(() => {
    fetch(`${API_URL}?action=getDrugMaster&token=${(window.NARCOTICS_SESSION||{}).token}`)
      .then(res => res.json())
      .then(data => setDrugList(data.success ? data.data : []))
      .catch(() => setDrugList([]));
  }, []);

  const handleChange = (val) => {
    setQuery(val);
    const found = (drugList || []).find(d => d.itemName === val || d.itemCode === val);
    setMatched(found || null);
    if (found) onSelect(found);
  };

  return (
    <div>
      <label>รายชื่อยาที่ต้องการเบิก <span className="required-mark">*</span></label>
      <input
        list="dispenseDrugList"
        value={query}
        onChange={e => handleChange(e.target.value)}
        placeholder={drugList === null ? "กำลังโหลดฐานข้อมูลยา..." : "พิมพ์ชื่อยาหรือรหัสยา..."}
      />
      <datalist id="dispenseDrugList">
        {(drugList || []).map(d => <option key={d.itemCode} value={d.itemName} />)}
      </datalist>
      {drugList === null && (
        <div className="loading-row" style={{marginTop: "4px"}}><span className="spinner"></span> กำลังโหลดฐานข้อมูลยา...</div>
      )}
      {matched && (
        <div className="sub" style={{marginTop: "4px"}}>รหัส: {matched.itemCode} · หน่วย: {matched.unit || "-"}</div>
      )}
    </div>
  );
}

/* ---------------- ป๊อปอัพเลือกสถานะใบ ย.ส.2/ว.จ.2 ---------------- */
function YS2StatusModal({ onChoose }) {
  return (
    <div className="modal-backdrop">
      <div className="modal-box">
        <h2>สถานะใบ ย.ส.2 / ว.จ.2</h2>
        <div className="sub">บันทึกการเบิกยาสำเร็จแล้ว กรุณาเลือกสถานะใบ ย.ส.2/ว.จ.2 ของรายการนี้</div>
        <div className="modal-btn-row">
          <button className="pending" onClick={() => onChoose("pending")}>ค้างรับใบ ย.ส.2 / ว.จ.2</button>
          <button className="received" onClick={() => onChoose("received")}>รับใบ ย.ส.2 / ว.จ.2 เรียบร้อยแล้ว</button>
        </div>
      </div>
    </div>
  );
}

/* ---------------- บันทึกการเบิกยา ---------------- */
function DispenseEntryPanel({ staffName }) {
  const [storagePoint, setStoragePoint] = useState("sub_warehouse");
  const [patientType, setPatientType] = useState("OPD");
  const [patientHN, setPatientHN] = useState("");
  const [drug, setDrug] = useState(null); // { itemCode, itemName, unit }
  const [qty, setQty] = useState("");
  const [notes, setNotes] = useState("");
  const [status, setStatus] = useState(null);
  const [loading, setLoading] = useState(false);
  const [showModal, setShowModal] = useState(false);
  const [pendingSubmitData, setPendingSubmitData] = useState(null);

  const onDrugSelect = (d) => {
    setDrug(d);
    if (DEFAULT_QTY_ONE_DRUGS.indexOf(d.itemName) !== -1) {
      setQty("1");
    }
  };

  const resetForm = () => {
    setPatientHN(""); setDrug(null); setQty(""); setNotes("");
  };

  const submit = () => {
    if (!drug || !patientHN || !qty) {
      setStatus({ ok: false, msg: "กรุณากรอกเลข HN, เลือกรายการยา และจำนวนเบิกให้ครบ" });
      return;
    }
    setStatus(null);
    // ยังไม่ยิง API ตอนนี้ — ถามสถานะใบ ย.ส.2/ว.จ.2 ผ่านป๊อปอัพก่อน แล้วค่อยบันทึกจริง
    setPendingSubmitData({ storagePoint, patientType, patientHN, drug, qty, notes });
    setShowModal(true);
  };

  const finalizeSubmit = async (ys2Status) => {
    setShowModal(false);
    setLoading(true);
    setStatus(null);
    try {
      const d = pendingSubmitData;
      const res = await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ token: (window.NARCOTICS_SESSION||{}).token, 
          action: "submitDispensing",
          storagePoint: d.storagePoint,
          patientType: d.patientType,
          patientHN: d.patientHN,
          itemCode: d.drug.itemCode,
          itemName: d.drug.itemName,
          unit: d.drug.unit,
          qty: d.qty,
          ys2Status,
          staffName,
          notes: d.notes
        })
      });
      const data = await res.json();
      if (data.success) {
        const warnSuffix = data.codeMismatchWarning ? data.codeMismatchWarning : "";
        setStatus({ ok: true, msg: `บันทึกการเบิกยาสำเร็จ (สถานะใบ: ${ys2Status === "pending" ? "ค้างรับ" : "รับเรียบร้อยแล้ว"})${warnSuffix}` });
        resetForm();
      } else {
        setStatus({ ok: false, msg: data.error });
      }
    } catch (err) {
      setStatus({ ok: false, msg: "เชื่อมต่อไม่สำเร็จ: " + err.message });
    }
    setLoading(false);
    setPendingSubmitData(null);
  };

  return (
    <div>
      <label>จุดเบิกยา</label>
      <div className="toggle-row">
        {DISPENSE_POINTS.map(p => (
          <button key={p.value} className={storagePoint === p.value ? "active" : ""} onClick={() => setStoragePoint(p.value)}>
            {p.label}
          </button>
        ))}
      </div>

      <label>ประเภทผู้ป่วย</label>
      <div className="toggle-row">
        <button className={patientType === "OPD" ? "active" : ""} onClick={() => setPatientType("OPD")}>OPD</button>
        <button className={patientType === "IPD" ? "active" : ""} onClick={() => setPatientType("IPD")}>IPD</button>
      </div>

      <label>เลข HN ผู้ป่วย <span className="required-mark">*</span></label>
      <div className="field-icon">
        <span className="fi-icon"><Icon name="id-card" size={16} /></span>
        <input value={patientHN} onChange={e => setPatientHN(e.target.value)} />
      </div>

      <div style={{marginTop: "10px"}}>
        <DrugMasterPicker onSelect={onDrugSelect} />
      </div>

      <label>จำนวนเบิก <span className="required-mark">*</span></label>
      <div className="field-icon">
        <span className="fi-icon"><Icon name="hash" size={16} /></span>
        <input type="number" value={qty} onChange={e => setQty(e.target.value)} />
      </div>

      <label>หมายเหตุ</label>
      <textarea rows="2" value={notes} onChange={e => setNotes(e.target.value)} />

      <button style={{marginTop: "16px"}} disabled={loading} onClick={submit}>
        {loading ? (<span className="loading-row"><span className="spinner"></span> กำลังบันทึก...</span>) : "บันทึกการเบิกยา"}
      </button>

      {status && <div className={`status ${status.ok ? "ok" : "err"}`}>{status.msg}</div>}

      {showModal && <YS2StatusModal onChoose={finalizeSubmit} />}
    </div>
  );
}

/* ---------------- รายงานการเบิกจ่าย ---------------- */
function ReportPanel() {
  const [drugList, setDrugList] = useState(null);
  const [itemCode, setItemCode] = useState("");
  const [startDate, setStartDate] = useState("");
  const [endDate, setEndDate] = useState("");
  const [rows, setRows] = useState(null);
  const [status, setStatus] = useState(null);
  const [loading, setLoading] = useState(false);

  useEffect(() => {
    fetch(`${API_URL}?action=getDrugMaster&token=${(window.NARCOTICS_SESSION||{}).token}`)
      .then(res => res.json())
      .then(data => setDrugList(data.success ? data.data : []))
      .catch(() => setDrugList([]));
  }, []);

  const runReport = async () => {
    setLoading(true);
    setStatus(null);
    try {
      const params = new URLSearchParams({ action: "getDispensingReport" });
      params.set("token", (window.NARCOTICS_SESSION||{}).token);
      if (itemCode) params.set("itemCode", itemCode);
      if (startDate) params.set("startDate", startDate);
      if (endDate) params.set("endDate", endDate);
      const res = await fetch(`${API_URL}?${params.toString()}`);
      const data = await res.json();
      if (data.success) {
        setRows(data.data);
        if (data.data.length === 0) setStatus({ ok: true, msg: "ไม่พบข้อมูลในช่วงที่เลือก" });
      } else {
        setStatus({ ok: false, msg: data.error });
      }
    } catch (err) {
      setStatus({ ok: false, msg: "เชื่อมต่อไม่สำเร็จ: " + err.message });
    }
    setLoading(false);
  };

  const exportExcel = () => {
    if (!rows || rows.length === 0) return;
    const sheetData = rows.map(r => ({
      "วันที่เบิก": r.date,
      "รายชื่อยา": r.itemName,
      "จ่ายไป (HN)": r.patientHN,
      "จำนวนจ่าย": r.qty,
      "หน่วย": r.unit,
      "หมายเหตุ": r.notes
    }));
    const ws = XLSX.utils.json_to_sheet(sheetData);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "รายงานการเบิกจ่าย");
    const fileNameSuffix = (startDate || "all") + "_to_" + (endDate || "all");
    XLSX.writeFile(wb, `dispensing-report-${fileNameSuffix}.xlsx`);
  };

  return (
    <div>
      <div className="sub">เลือกรายการยา (เว้นว่าง = ทุกรายการ) และช่วงวันที่ ที่ต้องการดูรายงาน</div>
      <div className="form-row">
        <div>
          <label>รายการยา</label>
          <select value={itemCode} onChange={e => setItemCode(e.target.value)}>
            <option value="">-- ทุกรายการ --</option>
            {(drugList || []).map(d => <option key={d.itemCode} value={d.itemCode}>{d.itemName}</option>)}
          </select>
        </div>
        <div></div>
        <div><label>วันที่เริ่มต้น</label><DateFilterField value={startDate} onChange={setStartDate} /></div>
        <div><label>วันที่สิ้นสุด</label><DateFilterField value={endDate} onChange={setEndDate} /></div>
      </div>

      <div style={{display: "flex", gap: "10px", marginTop: "16px"}}>
        <button disabled={loading} onClick={runReport}>{loading ? "กำลังค้นหา..." : "ค้นหารายงาน"}</button>
        <button className="secondary" disabled={!rows || rows.length === 0} onClick={exportExcel}>📥 ดาวน์โหลด Excel</button>
      </div>

      {status && <div className={`status ${status.ok ? "ok" : "err"}`}>{status.msg}</div>}

      {rows && rows.length > 0 && (
        <div className="scroll-table" style={{marginTop: "16px"}}>
          <table>
            <thead>
              <tr>
                <th>วันที่เบิก</th>
                <th>รายชื่อยา</th>
                <th>จ่ายไป (HN)</th>
                <th>จำนวนจ่าย</th>
                <th>หน่วย</th>
                <th>หมายเหตุ</th>
              </tr>
            </thead>
            <tbody>
              {rows.map((r, i) => (
                <tr key={i}>
                  <td>{r.date}</td>
                  <td>{r.itemName}</td>
                  <td>{r.patientHN}</td>
                  <td>{fmt(r.qty)}</td>
                  <td>{r.unit}</td>
                  <td>{r.notes}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

/* ---------------- ประวัติการจ่ายยา / ติดตามใบ ย.ส.2/ว.จ.2 ---------------- */
function HistoryPanel() {
  const [rows, setRows] = useState(null);
  const [statusFilter, setStatusFilter] = useState("pending"); // 'pending' | 'all'
  const [status, setStatus] = useState(null);
  const [markingId, setMarkingId] = useState(null);
  const [togglingId, setTogglingId] = useState(null);
  const isAdmin = (window.NARCOTICS_SESSION || {}).role === "admin";
  const [editRow, setEditRow] = useState(null); // แถวที่กำลังแก้ไข (สำเนาข้อมูล)
  const [saving, setSaving] = useState(false);
  const [deletingId, setDeletingId] = useState(null);

  const load = () => {
    setRows(null);
    fetch(`${API_URL}?action=getDispensingHistory&token=${(window.NARCOTICS_SESSION||{}).token}`)
      .then(res => res.json())
      .then(data => {
        if (data.success) setRows(data.data);
        else { setStatus({ ok: false, msg: data.error }); setRows([]); }
      })
      .catch(err => { setStatus({ ok: false, msg: "เชื่อมต่อไม่สำเร็จ: " + err.message }); setRows([]); });
  };

  useEffect(load, []);

  const markReceived = async (dispenseId) => {
    setMarkingId(dispenseId);
    setStatus(null);
    try {
      const res = await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ token: (window.NARCOTICS_SESSION||{}).token,  action: "markYS2Received", dispenseId })
      });
      const data = await res.json();
      if (data.success) {
        setStatus({ ok: true, msg: "บันทึกรับใบ ย.ส.2/ว.จ.2 เรียบร้อยแล้ว" });
        load();
      } else {
        setStatus({ ok: false, msg: data.error });
      }
    } catch (err) {
      setStatus({ ok: false, msg: "เชื่อมต่อไม่สำเร็จ: " + err.message });
    }
    setMarkingId(null);
  };

  const adminToggleStatus = async (dispenseId, currentStatus) => {
    const newStatus = currentStatus === "pending" ? "received" : "pending";
    setTogglingId(dispenseId);
    setStatus(null);
    try {
      const res = await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ token: (window.NARCOTICS_SESSION||{}).token, action: "adminSetYS2Status", dispenseId, status: newStatus })
      });
      const data = await res.json();
      if (data.success) {
        setStatus({ ok: true, msg: `ปรับสถานะเป็น "${newStatus === "pending" ? "ค้างรับ" : "รับเรียบร้อยแล้ว"}" เรียบร้อยแล้ว` });
        load();
      } else {
        setStatus({ ok: false, msg: data.error });
      }
    } catch (err) {
      setStatus({ ok: false, msg: "เชื่อมต่อไม่สำเร็จ: " + err.message });
    }
    setTogglingId(null);
  };

  const saveEdit = async () => {
    setSaving(true);
    setStatus(null);
    try {
      const res = await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({
          token: (window.NARCOTICS_SESSION||{}).token,
          action: "updateDispensingEntry",
          dispenseId: editRow.dispenseId,
          patientHN: editRow.patientHN,
          patientType: editRow.patientType,
          qty: editRow.qty,
          notes: editRow.notes,
          editedBy: (window.NARCOTICS_SESSION||{}).displayName
        })
      });
      const data = await res.json();
      if (data.success) {
        setStatus({ ok: true, msg: "แก้ไขรายการเรียบร้อยแล้ว" });
        setEditRow(null);
        load();
      } else {
        setStatus({ ok: false, msg: data.error });
      }
    } catch (err) {
      setStatus({ ok: false, msg: "เชื่อมต่อไม่สำเร็จ: " + err.message });
    }
    setSaving(false);
  };

  const deleteEntry = async (r) => {
    if (!window.confirm(`ยืนยันลบรายการเบิก "${r.itemName}" จำนวน ${r.qty} ${r.unit} (HN ${r.patientHN}) ใช่ไหม?\nระบบจะคืนจำนวนนี้กลับเข้าคงคลังให้อัตโนมัติ การกระทำนี้ย้อนกลับไม่ได้`)) return;
    setDeletingId(r.dispenseId);
    setStatus(null);
    try {
      const res = await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({
          token: (window.NARCOTICS_SESSION||{}).token,
          action: "deleteDispensingEntry",
          dispenseId: r.dispenseId,
          deletedBy: (window.NARCOTICS_SESSION||{}).displayName
        })
      });
      const data = await res.json();
      if (data.success) {
        setStatus({ ok: true, msg: "ลบรายการและคืนจำนวนเข้าคงคลังเรียบร้อยแล้ว" });
        load();
      } else {
        setStatus({ ok: false, msg: data.error });
      }
    } catch (err) {
      setStatus({ ok: false, msg: "เชื่อมต่อไม่สำเร็จ: " + err.message });
    }
    setDeletingId(null);
  };

  const filtered = (rows || []).filter(r => statusFilter === "all" || r.ys2Status === statusFilter);

  return (
    <div>
      <div className="sub">ประวัติการเบิกยาทุกรายการ — เมื่อได้รับใบ ย.ส.2/ว.จ.2 ฉบับสมบูรณ์คืนแล้ว กดปุ่ม "รับใบเรียบร้อยแล้ว" เพื่อปิดการติดตาม</div>
      <div className="tab-bar">
        <button className={statusFilter === "pending" ? "active" : ""} onClick={() => setStatusFilter("pending")}>ค้างรับใบเท่านั้น</button>
        <button className={statusFilter === "all" ? "active" : ""} onClick={() => setStatusFilter("all")}>ทั้งหมด</button>
        <button className="secondary" onClick={load} style={{marginLeft: "auto"}}>🔄 รีเฟรช</button>
      </div>

      {rows === null && <div className="sub">กำลังโหลด...</div>}
      {rows && filtered.length === 0 && <div className="sub">ไม่พบรายการ</div>}

      {rows && filtered.length > 0 && (
        <div className="scroll-table">
          <table>
            <thead>
              <tr>
                <th>วันที่เบิก</th>
                <th>จุดเบิก</th>
                <th>รายชื่อยา</th>
                <th>HN</th>
                <th>ประเภทผู้ป่วย</th>
                <th>จำนวน</th>
                <th>สถานะใบ ย.ส.2/ว.จ.2</th>
                <th>รับใบเมื่อ</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              {filtered.map((r, i) => (
                <tr key={i}>
                  <td>{r.timestamp}</td>
                  <td>{r.storagePoint === "sub_warehouse" ? "คลังยาย่อย" : "ตู้ ER"}</td>
                  <td>{r.itemName}</td>
                  <td>{r.patientHN}</td>
                  <td>{r.patientType}</td>
                  <td>{fmt(r.qty)} {r.unit}</td>
                  <td>{r.ys2Status === "pending" ? "⏳ ค้างรับ" : "✅ รับแล้ว"}</td>
                  <td>{r.ys2ReceivedAt || "-"}</td>
                  <td>
                    {r.ys2Status === "pending" && (
                      <button disabled={markingId === r.dispenseId} onClick={() => markReceived(r.dispenseId)}>
                        {markingId === r.dispenseId ? "กำลังบันทึก..." : "รับใบเรียบร้อยแล้ว"}
                      </button>
                    )}
                    {isAdmin && (
                      <button
                        className="secondary"
                        style={{marginLeft: "6px"}}
                        disabled={togglingId === r.dispenseId}
                        onClick={() => adminToggleStatus(r.dispenseId, r.ys2Status)}
                      >
                        {togglingId === r.dispenseId ? "กำลังปรับ..." : (r.ys2Status === "pending" ? "ปรับเป็นรับแล้ว" : "ปรับเป็นค้างรับ")}
                      </button>
                    )}
                    {isAdmin && (
                      <button className="secondary" style={{marginLeft: "6px"}} onClick={() => setEditRow({ ...r })}>
                        แก้ไข
                      </button>
                    )}
                    {isAdmin && (
                      <button
                        className="danger"
                        style={{marginLeft: "6px"}}
                        disabled={deletingId === r.dispenseId}
                        onClick={() => deleteEntry(r)}
                      >
                        {deletingId === r.dispenseId ? "กำลังลบ..." : "ลบ"}
                      </button>
                    )}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
      {status && <div className={`status ${status.ok ? "ok" : "err"}`}>{status.msg}</div>}

      {editRow && (
        <div className="modal-backdrop">
          <div className="modal-box" style={{maxWidth: "420px", textAlign: "left"}}>
            <h2>แก้ไขรายการเบิกยา (admin)</h2>
            <div className="sub" style={{marginBottom: "14px"}}>
              {editRow.itemName} — เบิกเมื่อ {editRow.timestamp}
            </div>

            <label>เลข HN ผู้ป่วย</label>
            <input value={editRow.patientHN} onChange={e => setEditRow({ ...editRow, patientHN: e.target.value })} />

            <label>ประเภทผู้ป่วย</label>
            <div className="toggle-row">
              <button className={editRow.patientType === "OPD" ? "active" : ""} onClick={() => setEditRow({ ...editRow, patientType: "OPD" })}>OPD</button>
              <button className={editRow.patientType === "IPD" ? "active" : ""} onClick={() => setEditRow({ ...editRow, patientType: "IPD" })}>IPD</button>
            </div>

            <label>จำนวนเบิก (แก้ไขแล้วจะปรับจำนวนคงคลังให้อัตโนมัติ)</label>
            <input type="number" value={editRow.qty} onChange={e => setEditRow({ ...editRow, qty: e.target.value })} />

            <label>หมายเหตุ</label>
            <textarea rows="2" value={editRow.notes || ""} onChange={e => setEditRow({ ...editRow, notes: e.target.value })} />

            <div className="modal-btn-row" style={{marginTop: "14px"}}>
              <button disabled={saving} onClick={saveEdit}>{saving ? "กำลังบันทึก..." : "บันทึกการแก้ไข"}</button>
              <button className="secondary" onClick={() => setEditRow(null)} disabled={saving}>ยกเลิก</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function App() {
  const [tab, setTab] = useState("entry");
  const session = window.NARCOTICS_SESSION || {};
  const staffName = session.displayName;

  return (
    <div className="app">
      <div className="card">
        <h1>เบิกยาให้ผู้ป่วยเฉพาะราย — Dispensing Entry</h1>
        <div className="sub">คลังยาย่อย / ตู้ยาเสพติด ER นอกเวลา</div>
        <div className="sub" style={{marginTop: "-8px"}}>
          ผู้เบิก/บันทึก: <b style={{color: "#102a43"}}>{session.displayName}</b> ({session.username}) — ใช้บัญชีที่เข้าสู่ระบบเป็นผู้ลงบันทึกโดยอัตโนมัติ
        </div>
      </div>

      <div className="card">
        <div className="tab-bar">
          <button className={tab === "entry" ? "active" : ""} onClick={() => setTab("entry")}><Icon name="edit" size={15} /> บันทึกการเบิกยา</button>
          <button className={tab === "history" ? "active" : ""} onClick={() => setTab("history")}><Icon name="history" size={15} /> ประวัติการจ่ายยา / ติดตามใบ ย.ส.2</button>
          <button className={tab === "report" ? "active" : ""} onClick={() => setTab("report")}><Icon name="chart" size={15} /> รายงานการเบิกจ่าย</button>
        </div>
        {tab === "entry" && <DispenseEntryPanel staffName={staffName} />}
        {tab === "history" && <HistoryPanel />}
        {tab === "report" && <ReportPanel />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
